[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "3.0.0"
authors = ["sjorge"]
rust-version = "1.99.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# TLS is the platform's native TLS.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive", "env"] }
# native-tls must be selected at runtime via `TlsProvider::NativeTls`. Not `native-tls`: that
# feature also bundles the Mozilla roots (`native-tls-webpki-roots`), and the system trust store
# is wanted. Every agent sets its `RootCerts` explicitly (`anidb_http::tls`), because ureq's
# default, `RootCerts::WebPki`, panics at request time without the bundled roots.
ureq = { version = "3.5", default-features = false, features = ["gzip", "json", "native-tls-no-default"] }
gethostname = "1.1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "0.42", features = ["serialize"] }
aes = "0.9"
ecb = { version = "0.2", features = ["alloc"] }
md4 = "0.11"
md-5 = { version = "0.11", default-features = false }
sha1 = "0.11"
sha2 = { version = "0.11", default-features = false }
crc32fast = "1.5"
hex = "0.4"
terminal_size = "0.4"
regex = { version = "1.12", default-features = false, features = ["std", "unicode-perl"] }
strsim = "0.11"
alphanumeric-sort = "1.5"
html-escape = "0.3"
unicode-normalization = { version = "0.1", default-features = false }
# dev-dependencies
tempfile = "3.23"
assert_cmd = "2.1"
filetime = "0.2"
serial_test = "4.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The hash crates run over tens of MB in the dev and test builds. Optimise only them, so the suite stays fast.
[profile.dev.package.md4]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3
